<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floppy</title>

    <!-- Terminal.css (classless global styles) -->
    <link rel="stylesheet" href="https://unpkg.com/terminal.css@0.7.4/dist/terminal.min.css" />

    <!-- App-specific overrides -->
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Floppy</h1>
      <p>Server is running.</p>

      <h2>API</h2>
      <ul>
        <li><code>POST /api/v1/fs/list</code></li>
        <li><code>POST /api/v1/mountpoints/list</code></li>
      </ul>

      <h2>Quick action</h2>
      <form class="terminal" method="post" action="#" autocomplete="off">
        <fieldset>
          <legend>Run command</legend>

          <p class="hint">
            This is a UI-only form for now (no backend wired). It’s styled by Terminal.css.
          </p>

          <label for="path">Path</label>
          <input id="path" name="path" type="text" placeholder="/Users/you" />

          <label for="action">Action</label>
          <select id="action" name="action">
            <option value="list" selected>List directory</option>
            <option value="mountpoints">List mount points</option>
          </select>

          <label class="checkbox">
            <input id="hidden" name="hidden" type="checkbox" />
            <span>Show hidden files</span>
          </label>

          <div class="form-actions">
            <button type="submit">Run</button>
            <button type="reset">Reset</button>
          </div>
        </fieldset>
      </form>
    </main>
  </body>
</html>

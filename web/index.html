<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>

    <!-- Terminal.css (classless global styles) -->
    <link rel="stylesheet" href="https://unpkg.com/terminal.css@0.7.4/dist/terminal.min.css" />

    <!-- App-specific overrides -->
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>{{.Title}}</h1>
      <p>Server is running.</p>

      <h2>API</h2>
      <ul>
        <li><code>POST /api/v1/fs/list</code></li>
        <li><code>POST /api/v1/mountpoints/list</code></li>
      </ul>

      <h2>Mount points</h2>
      {{if .MountPoints}}
      <ul class="terminal">
        {{range .MountPoints}}
        <li><code>{{.}}</code></li>
        {{end}}
      </ul>
      {{else}}
      <p><em>No mount points configured.</em></p>
      {{end}}
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floppy</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        margin: 40px;
        line-height: 1.5;
      }
      code {
        background: #f4f4f4;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .card {
        max-width: 720px;
        padding: 20px 24px;
        border: 1px solid #e6e6e6;
        border-radius: 10px;
      }
      h1 {
        margin-top: 0;
      }
      ul {
        padding-left: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Floppy</h1>
      <p>Server is running.</p>

      <h2>API</h2>
      <ul>
        <li><code>POST /api/v1/fs/list</code></li>
        <li><code>POST /api/v1/mountpoints/list</code></li>
      </ul>
    </div>
  </body>
</html>

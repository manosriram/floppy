<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>

    <link rel="stylesheet" href="https://unpkg.com/terminal.css@0.7.4/dist/terminal.min.css" />
    <link rel="stylesheet" href="/styles.css" />

    <style>
      :root {
        --page-font-size: 18px;
      }

      html {
        font-size: var(--page-font-size);
      }

      body {
        margin: 0 auto;
        padding: 2.5rem 1.25rem;
      }

      main {
        display: grid;
        gap: 1rem;
      }

      header.page-header {
        display: grid;
        gap: 0.75rem;
      }

      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      p.empty {
        margin: 0.25rem 0 0 0;
        opacity: 0.85;
      }

      /* Table view (mirrors mount.html styling) */
      .file-table {
        width: 100%;
        border-collapse: collapse;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      .file-table th,
      .file-table td {
        padding: 0.35rem 0.6rem;
        line-height: 1.15;
        vertical-align: middle;
      }

      .file-table thead th {
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      }

      .file-table tbody tr {
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      .file-table th {
        text-align: left;
        font-weight: 600;
        opacity: 0.9;
      }

      .file-table td.name a {
        text-decoration: none;
      }

      .file-table td.name a:hover {
        text-decoration: underline;
      }

      .badge {
        display: inline-block;
        padding: 0.1rem 0.45rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        opacity: 0.95;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div class="title-row">
          <h1>Mount points</h1>
        </div>
      </header>

      {{if .MountPoints}}
      <section aria-label="Mount points">
        <table class="file-table">
          <thead>
            <tr>
              <th class="name">Name</th>
              <th class="name">Path</th>
            </tr>
          </thead>
          <tbody>
            {{range $key, $value := .MountPoints}}
            <tr>
              <td class="name">
                <a href="/{{$key}}">{{$key}}</a>
              </td>
              <td class="name">
                <span class="badge">{{$value}}</span>
              </td>
            </tr>
            {{end}}
          </tbody>
        </table>
      </section>
      {{else}}
      <p class="empty"><em>No mount points configured.</em></p>
      {{end}}
    </main>
  </body>
</html>

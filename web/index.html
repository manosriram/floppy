<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>

    <link rel="stylesheet" href="https://unpkg.com/terminal.css@0.7.4/dist/terminal.min.css" />
    <link rel="stylesheet" href="/styles.css" />
		<link rel="icon" type="image/png" href="/floppy.png" />


    <style>
      :root {
        --page-font-size: 18px;
      }

      html {
        font-size: var(--page-font-size);
      }

      body {
        margin: 0 auto;
        padding: 2.5rem 1.25rem;
      }

      main {
        display: grid;
        gap: 1rem;
      }

      header.page-header {
        display: grid;
        gap: 0.75rem;
      }

      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      p.empty {
        margin: 0.25rem 0 0 0;
        opacity: 0.85;
      }

      /* Mountpoint buttons */
      .mountpoints {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
        gap: 0.75rem;
        margin-top: 0.5rem;
      }

      .mountpoint-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 0.85rem 0.9rem;
        border-radius: 12px;

        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.03);

        text-decoration: none;
        color: inherit;

        font-weight: 600;
        letter-spacing: 0.01em;

        user-select: none;
      }

      .mountpoint-btn:hover {
        border-color: rgba(255, 255, 255, 0.32);
        background: rgba(255, 255, 255, 0.05);
        text-decoration: none;
      }

      .mountpoint-btn:active {
        transform: translateY(1px);
      }

      .mountpoint-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div class="title-row">
          <h1>Floppy</h1>
        </div>
      </header>

      {{if .MountPoints}}
      <section aria-label="Mount points">
        <div class="mountpoints">
          {{range $key, $value := .MountPoints}}
            <a class="mountpoint-btn" href="/{{$key}}" aria-label="Open mountpoint {{$key}}">
              <button class="mountpoint-name" style="width:50vw;">{{$key}}</button>
            </a>
          {{end}}
        </div>
      </section>
      {{else}}
      <p class="empty"><em>No mount points configured.</em></p>
      {{end}}
    </main>
  </body>
</html>
